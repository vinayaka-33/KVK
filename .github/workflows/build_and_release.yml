name: Build Professional APK
on:
  push:
    branches: [ "main" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
          cache: true
      - name: Create App
        run: flutter create expense_tracker
      - name: Inject Professional Code and Fix API Levels
        run: |
          cp project_files/pubspec.yaml expense_tracker/pubspec.yaml
          cp project_files/main.dart expense_tracker/lib/main.dart
          sed -i 's/flutter.targetSdkVersion/34/g' expense_tracker/android/app/build.gradle
          sed -i 's/flutter.compileSdkVersion/34/g' expense_tracker/android/app/build.gradle
      - name: Build APK
        working-directory: ./expense_tracker
        run: |
          flutter pub get
          flutter build apk --release
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Professional-Expense-Tracker
          path: expense_tracker/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
