name: Build Flutter APK
on:
  push:
    branches: [ "main" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
      - name: Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
          cache: true
      - name: Generate Flutter Scaffolding
        run: flutter create expense_tracker
      - name: Inject Custom Architecture
        run: |
          cp project_files/pubspec.yaml expense_tracker/pubspec.yaml
          cp project_files/main.dart expense_tracker/lib/main.dart
      - name: Resolve Dependencies
        working-directory: ./expense_tracker
        run: flutter pub get
      - name: Automated Android Build
        working-directory: ./expense_tracker
        run: flutter build apk --release
      - name: Artifact Archival
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: expense_tracker/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
